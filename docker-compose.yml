version: "3.9"
services:
  iptv_restream_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Set this to the server ip/domain, if your backend is deployed on a different server
        #VITE_BACKEND_URL: http://123.123.123.123:5000
        VITE_STREAM_DELAY: 18
        VITE_STREAM_PROXY_DELAY: 30
        # Optional settings for synchronization
        #VITE_SYNCHRONIZATION_TOLERANCE: 1.25
        #VITE_SYNCHRONIZATION_MAX_DEVIATION: 5
        #VITE_SYNCHRONIZATION_ADJUSTMENT: 0.02
        #VITE_SYNCHRONIZATION_MAX_ADJUSTMENT: 0.04

    networks:
      - app-network

  iptv_restream_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - streams_data:/streams
      - channels:/channels
    environment:
      STORAGE_PATH: /streams/
      AUTH_VIEWER_USERNAME: "${AUTH_VIEWER_USERNAME:-}"
      AUTH_VIEWER_PASSWORD: "${AUTH_VIEWER_PASSWORD:-}"
      AUTH_ADMIN_USERNAME: "${AUTH_ADMIN_USERNAME:-}"
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD:-}"
      # If you have problems with the playlist, set the backend url manually here
      #BACKEND_URL: http://localhost:5000

      # CHANNEL_SELECTION_REQUIRES_ADMIN: "true"
    networks:
      - app-network

  # Nginx Reverse Proxy
  iptv_restream_nginx:
    image: nginx:alpine
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - streams_data:/streams
    ports:
      - "80:80"
    networks:
      - app-network

volumes:
  streams_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  channels:

# Internal docker network
networks:
  app-network:
    driver: bridge
