worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_x_forwarded_proto $x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_port $x_forwarded_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;

        # Normalize extensionless frontend routes to directory-style URLs.
        # Vite uses extensionless internal module URLs such as /@vite/client.
        # Never normalize those application-internal requests.
        if ($uri ~ ^/(?!@|api(?:/|$)|socket\.io(?:/|$)|proxy(?:/|$)|streams(?:/|$))(?:.*/)?[^/.]+$) {
            return 302 $uri/$is_args$args;
        }

        # Older dev-proxy configuration permanently redirected these Vite
        # modules. Continue serving the cached trailing-slash destinations so
        # existing browser tabs recover without clearing site data.
        location = /@vite/client/ {
            proxy_pass http://iptv_restream_frontend:8080/@vite/client;
        }

        location = /@react-refresh/ {
            proxy_pass http://iptv_restream_frontend:8080/@react-refresh;
        }

        # Vite development server, including its hot-module-reload WebSocket.
        location / {
            proxy_pass http://iptv_restream_frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/ {
            proxy_pass http://iptv_restream_backend:5000;

            proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $x_forwarded_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header 'Access-Control-Allow-Origin' '*';
        }

        location /socket.io/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_pass http://iptv_restream_backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /proxy/ {
            proxy_pass http://iptv_restream_backend:5000;
            proxy_set_header Host $host;

            proxy_hide_header Content-Type;
            add_header Content-Type 'application/vnd.apple.mpegurl' always;
            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }

        location /streams/ {
            root /;

            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range';
            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }
    }
}
