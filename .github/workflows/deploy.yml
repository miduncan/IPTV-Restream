name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_DIRECTORY: iptv-restream

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: backend
            context: ./backend
          - service: nginx
            context: ./deployment/nginx

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to DigitalOcean
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out deployment manifest
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DIGITALOCEAN_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy deployment manifest
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DEPLOY_USER: ${{ secrets.DIGITALOCEAN_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIRECTORY'"
          scp deployment/ghcr-docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIRECTORY/compose.yml"

      - name: Pull and start images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DEPLOY_USER: ${{ secrets.DIGITALOCEAN_USER }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_REGISTRY="${IMAGE_REGISTRY,,}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIRECTORY' && IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env -f compose.yml pull && IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env -f compose.yml up -d --remove-orphans"
