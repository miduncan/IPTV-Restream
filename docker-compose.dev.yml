services:
  iptv_restream_frontend:
    # Keep the development target separate from the production Nginx image.
    # Otherwise a production build can replace the shared Compose image and
    # leave `make dev` trying to run npm inside Nginx.
    image: iptv-restream-frontend-dev
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0
    restart: "no"
    init: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  iptv_restream_backend:
    image: iptv-restream-backend-dev
    command: npm run dev
    restart: "no"
    init: true
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  iptv_restream_nginx:
    restart: "no"
    volumes:
      - ./deployment/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

volumes:
  frontend_node_modules:
  backend_node_modules:
